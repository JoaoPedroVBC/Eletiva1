<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 4 - Novo Usuário</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-size: 1.05rem;
            color: #333;
            padding-top: 40px;
        }
        .card-custom {
            max-width: 850px;
            margin: auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border-top: 5px solid #5cb85c;
        }
        .form-label {
            font-weight: 600;
            color: #333;
        }
        .btn-enviar {
            background-color: #5cb85c;
            color: white;
            border: none;
            font-weight: 500;
            padding: 8px 24px;
        }
        .btn-enviar:hover {
            background-color: #4cae4c;
            color: white;
        }
        .btn-cancelar {
            background-color: #ffffff;
            color: #6c757d;
            border: 1px solid #ced4da;
            padding: 8px 20px;
        }
        .btn-cancelar:hover {
            background-color: #e9ecef;
            color: #495057;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card-custom">
        <h3 class="mb-4 text-secondary" style="font-weight: 400;">Novo Usuário</h3>
        
        <form class="row g-3">
            
            <!-- Nome -->
            <div class="col-12">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" placeholder="Informe o nome...">
            </div>

            <!-- CPF, Endereço e Nível -->
            <div class="col-md-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" placeholder="Informe o cpf...">
            </div>
            <div class="col-md-6">
                <label for="endereco" class="form-label">Endereço:</label>
                <input type="text" class="form-control" id="endereco" placeholder="Informe o endereço...">
            </div>
            <div class="col-md-3">
                <label for="nivel" class="form-label">Nível:</label>
                <select class="form-select" id="nivel">
                    <option selected>--</option>
                    <option value="1">Administrador</option>
                    <option value="2">Usuário</option>
                </select>
            </div>

            <!-- Email, Senha e Status -->
            <div class="col-md-5">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Informe o email...">
            </div>
            <div class="col-md-4">
                <label for="senha" class="form-label">Senha:</label>
                <input type="password" class="form-control" id="senha" placeholder="Informe a senha...">
            </div>
            <div class="col-md-3">
                <label for="status" class="form-label">Status:</label>
                <select class="form-select" id="status">
                    <option selected>--</option>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>

            <!-- Botões alinhados à direita -->
            <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                <button type="submit" class="btn btn-enviar">Enviar</button>
                <button type="button" class="btn btn-cancelar">Cancelar</button>
            </div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
