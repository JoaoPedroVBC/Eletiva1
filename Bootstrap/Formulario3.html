<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 4 - Dados do Parceiro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-size: 1.1rem;
            color: #2c3e50;
            padding-top: 30px;
        }
        .card-custom {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid #8e44ad;
        }
        .btn-save {
            background-color: #8e44ad;
            color: white;
            font-weight: 500;
        }
        .btn-save:hover {
            background-color: #732d91;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card-custom">
        <h3 class="text-center mb-4" style="color: #8e44ad; font-weight: 700;">Formulário de Exemplo</h3>
        <form class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nome do Parceiro</label>
                <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">E-mail do Parceiro</label>
                <input type="email" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Razão Social do Parceiro</label>
                <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Celular do Parceiro</label>
                <input type="text" class="form-control">
            </div>

            <div class="col-12">
                <label class="form-label">Endereço do Parceiro</label>
                <textarea class="form-control" rows="2"></textarea>
            </div>

            <div class="col-md-6">
                <label class="form-label">Data de Início do Contrato</label>
                <input type="date" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Data de Término do Contrato</label>
                <input type="date" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Valor Mínimo do Empréstimo</label>
                <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Valor Máximo do Empréstimo</label>
                <input type="text" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Taxa de Juros (%)</label>
                <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Valor do Depósito</label>
                <input type="text" class="form-control">
            </div>

            <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-save px-5">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
