<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 5 - Endereço de Cobrança</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fc;
            font-size: 1.1rem;
            color: #2c3e50;
            padding-top: 40px;
        }
        .card-custom {
            max-width: 750px;
            margin: auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 35px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h4 {
            color: #4e73df;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .btn-checkout {
            background-color: #4e73df;
            color: white;
            font-size: 1.15rem;
            font-weight: 500;
            padding: 12px;
            border: none;
        }
        .btn-checkout:hover {
            background-color: #2e59d9;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card-custom">
        <h4>Endereço de Cobrança</h4>
        <form>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" required>
                </div>
                <div class="col-sm-6">
                    <label for="sobrenome" class="form-label">Sobrenome</label>
                    <input type="text" class="form-control" id="sobrenome" required>
                </div>

                <div class="col-12">
                    <label for="username" class="form-label">Nome de usuário</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="text" class="form-control" id="username" placeholder="Nome de usuário" required>
                    </div>
                </div>

                <div class="col-12">
                    <label for="email" class="form-label">E-mail <span class="text-muted">(Opcional)</span></label>
                    <input type="email" class="form-control" id="email" placeholder="voce@exemplo.com">
                </div>

                <div class="col-12">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="endereco" placeholder="Rua Principal, 1234" required>
                </div>

                <div class="col-12">
                    <label for="endereco2" class="form-label">Endereço 2 <span class="text-muted">(Opcional)</span></label>
                    <input type="text" class="form-control" id="endereco2" placeholder="Apartamento ou suíte">
                </div>

                <div class="col-md-5">
                    <label for="pais" class="form-label">País</label>
                    <select class="form-select" id="pais" required>
                        <option value="">Escolha...</option>
                        <option>Brasil</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado" required>
                        <option value="">Escolha...</option>
                        <option>São Paulo</option>
                        <option>Rio de Janeiro</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" placeholder="" required>
                </div>
            </div>

            <hr class="my-4">

            <button class="w-100 btn btn-checkout" type="submit">Continuar para o pagamento</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
