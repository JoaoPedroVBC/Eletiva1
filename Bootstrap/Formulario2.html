<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 3 - Cadastro de Cliente</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f4f8;
            font-size: 1.05rem;
            color: #2d3748;
            padding-top: 30px;
        }
        .card-custom {
            max-width: 950px;
            margin: auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }
        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }
        .btn-next {
            background-color: #2ecc71;
            color: white;
        }
        .btn-reset:hover { background-color: #c0392b; color: white; }
        .btn-next:hover { background-color: #27ae60; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="card-custom">
        <h4 class="mb-4 text-secondary">Cadastro de Cliente</h4>
        <form class="row g-3">
            <div class="col-md-1">
                <label class="form-label">Código</label>
                <input type="text" class="form-control bg-light text-center" value="32" readonly>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" placeholder="Nome Completo do Cliente">
            </div>
            <div class="col-md-4">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" placeholder="cliente@dominio.com">
            </div>
            <div class="col-md-3">
                <label class="form-label">CPF</label>
                <input type="text" class="form-control" placeholder="Só números">
            </div>

            <div class="col-md-2">
                <label class="form-label">Nº Celular</label>
                <input type="text" class="form-control" placeholder="Nº do celular">
            </div>
            <div class="col-md-2">
                <label class="form-label">Nº Telefone fixo</label>
                <input type="text" class="form-control" placeholder="Nº telefone">
            </div>
            <div class="col-md-2">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control" placeholder="ex: 88308070">
            </div>
            <div class="col-md-3">
                <label class="form-label">Logradouro</label>
                <input type="text" class="form-control" placeholder="ex: Rua 1400">
            </div>
            <div class="col-md-1">
                <label class="form-label">Nº</label>
                <input type="text" class="form-control" placeholder="Nº">
            </div>
            <div class="col-md-2">
                <label class="form-label">Bairro</label>
                <input type="text" class="form-control" placeholder="Bairro">
            </div>

            <div class="col-md-4">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" placeholder="Cidade">
            </div>
            <div class="col-md-2">
                <label class="form-label">UF</label>
                <input type="text" class="form-control" placeholder="UF">
            </div>
            <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-select">
                    <option selected>Selecione</option>
                    <option>Ativo</option>
                    <option>Inativo</option>
                </select>
            </div>

            <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                <button type="reset" class="btn btn-reset px-4">Resetar</button>
                <button type="button" class="btn btn-next px-4">Próximo</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
