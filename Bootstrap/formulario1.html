<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 1</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f9fc;
            font-size: 1.08rem;
            color: #2c3e50;
            padding-top: 40px;
        }
        .card-custom {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border-top: 5px solid #0d6efd;
        }
        .form-label {
            font-weight: 500;
        }
        .btn-custom {
            background-color: #0d6efd;
            color: #ffffff;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 6px;
        }
        .btn-custom:hover {
            background-color: #0b5ed7;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card-custom">
        <h4 class="mb-4" style="font-weight: 600;">Formulário 1</h4>
        
        <form class="row g-3">
            <!-- Primeira Linha: Nome, Apelido e Nome de utilizador -->
            <div class="col-md-4">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" value="Mark" required>
            </div>
            
            <div class="col-md-4">
                <label for="apelido" class="form-label">Apelido</label>
                <input type="text" class="form-control" id="apelido" value="Otto" required>
            </div>
            
            <div class="col-md-4">
                <label for="utilizador" class="form-label">Nome de utilizador</label>
                <div class="input-group">
                    <span class="input-group-text">@</span>
                    <input type="text" class="form-control" id="utilizador" placeholder="Utilizador" required>
                </div>
            </div>

            <!-- Segunda Linha: Cidade, Estado/Distrito e Código Postal -->
            <div class="col-md-6">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" placeholder="Cidade" required>
            </div>
            
            <div class="col-md-3">
                <label for="estado" class="form-label">Estado / Distrito</label>
                <input type="text" class="form-control" id="estado" placeholder="Estado" required>
            </div>
            
            <div class="col-md-3">
                <label for="codigo-postal" class="form-label">Código Postal</label>
                <input type="text" class="form-control" id="codigo-postal" placeholder="Código Postal" required>
            </div>

            <!-- Terceira Linha: Termos e Condições -->
            <div class="col-12 mt-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="termos" required>
                    <label class="form-check-label" for="termos">
                        Concordo com os termos e condições
                    </label>
                </div>
            </div>

            <!-- Botão de Submissão -->
            <div class="col-12 mt-4">
                <button class="btn btn-custom" type="submit">Submeter formulário</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
